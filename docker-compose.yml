version: "3.9"

services:

  redis:
    image: redis:7
    ports:
      - "6379:6379"   

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"   
    environment:
      POSTGRES_USER: ${POSTGRES_USER}         
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pr_analyzer                
    volumes:
      - pgdata:/var/lib/postgresql/data       

volumes:
  pgdata:   